# === Agent-Lights-Communication zone config (example) ===
# Copy to /etc/agent-lights-zones.conf. The daemon hot-reloads on file mtime (no restart).
#
# PROFILE:
#   B     = cluster units (each zone shows one host/VM/LXC)
#   A     = screens (each zone maps to a monitor)
#   empty = single-colour semaphore (default light language)
PROFILE=

# --- LED index ranges per physical element (global OpenRGB device[0] index) ---
# These MUST be calibrated for YOUR hardware: run OpenRGB, light up one LED index at a
# time (or a small range) and note which fan/pump ring it belongs to. Values below are
# placeholders for a 121-LED chain (an AIO pump ring + three radiator fans).
EL_FAN_LEFT=41-51,83-85
EL_PUMP=52-55
EL_FAN_RIGHT=56-70
EL_FAN_MIDDLE=71-82

# --- PROFILE B: element -> cluster unit (host | gpu-vm | lxc-agent | lxc-rag) ---
UNIT_PUMP=host
UNIT_FAN_RIGHT=lxc-rag
UNIT_FAN_MIDDLE=lxc-agent
UNIT_FAN_LEFT=gpu-vm

# --- GPU behaviour (profile B) ---
GPU_WORK_UTIL=20          # % util = "working" on the gpu-vm zone (blue)
GPU_SMOOTH_N=5            # smoothing window (readings) - damps inference bursts
NODATA_SCALE=0.30         # dimmed brightness for the "no data" state
# Collective effect at sustained full load: smoothed util > UTIL for > SEC -> rainbow on ALL zones.
GPU_TAKEOVER=rainbow      # rainbow | off
GPU_TAKEOVER_UTIL=70
GPU_TAKEOVER_SEC=15

# --- PROFILE A: element -> monitor index (0..3); monitor state from the laptop heartbeat "mon" ---
A_PUMP=0
A_FAN_RIGHT=1
A_FAN_MIDDLE=2
A_FAN_LEFT=3
