# === Agent-Lights-Communication daemon config (example) ===
# Copy to /etc/agent-lights.conf and edit for your host.
# Colours are RGB hex (RRGGBB).

COL_GREEN=00FF00
COL_BLUE=0000FF
COL_RED=FF0000
COL_ORANGE=FF4500
COL_VIOLET=8000FF

# Dip counter: n<=COUNT_CAP -> n dips; n>COUNT_CAP -> fast continuous pulse
COUNT_CAP=5

# Dip pattern (seconds)
DIP_MS=0.60
DIP_FLOOR=0.12
DIP_STEP=0.04
DIP_GAP=0.40
SERIES_PAUSE=2.5
FAST_MS=0.15

# Red poke (pending blocking decisions) - reversible: RED_POKE=0 disables it
RED_POKE=1
RED_POKE_SEC=9.0
RED_POKE_MS=0.30
RED_POKE_GAP=0.55
RED_POKE_RAMP_MS=0.22

# State-change crossfade (no black frame)
XFADE_MS=0.25
XFADE_STEP=0.04

# OpenRGB SDK server + fallback CLI binary (AppImage AppRun also works)
ORGB_HOST=127.0.0.1
ORGB_PORT=6742
ORGB_BIN=/opt/openrgb/OpenRGB

# GPU (rainbow when work in progress AND util>threshold); read via `qm guest exec` on the GPU VM
GPU_VMID=100
GPU_THRESH=20

# Staleness / cadence (seconds)
LAPTOP_STALE=300
HEALTH_STALE=2700
RECOMPUTE_SEC=20

# LXC containers running agent sessions (space-separated VMIDs). First one is also the health-log host.
LXC_AGENTS=200 201

# Zone profile B: which container backs the "lxc-agent" and "lxc-rag" units (see config.zones.example.conf).
LXC_AGENT_VMID=200
LXC_RAG_VMID=201

# Health log: last line must start with a timestamp; HEALTH_RED_RE flags a fault.
HEALTH_LOG=/var/log/agent-lights-health.log
HEALTH_RED_RE=\bRED\b|\bDOWN\b

# Waiting/decisions source: "panel" (read a computed count from an LXC) or "laptop" (heartbeat only)
WAIT_SOURCE=panel
PANEL_VMID=200
PANEL_WAIT_FILE=/run/panel/waiting.computed

# Paths
RUN_DIR=/run/agent-lights
WAIT_PERSIST=/var/lib/agent-lights/waiting
LOG=/var/log/agent-lights.log
DEBUG=0
